    <style>@-webkit-keyframes rotation {
    from {
        -webkit-transform: rotate(0deg);
    }

    to {
        -webkit-transform: rotate(360deg);
    }
}

@-moz-keyframes rotation {
    from {
        -moz-transform: rotate(0deg);
    }

    to {
        -moz-transform: rotate(360deg);
    }
}

@-o-keyframes rotation {
    from {
        -o-transform: rotate(0deg);
    }

    to {
        -o-transform: rotate(360deg);
    }
}

@keyframes rotation {
    from {
        transform: rotate(0deg);
    }

    to {
        transform: rotate(360deg);
    }
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: black;
    font-family: "Lucida Console", Monaco, monospace;

    color: white;

}

#game-container {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
}

canvas.emscripten {
    display: block;
    background-color: black;
    position: absolute;
    transition: opacity 0s ease-in;
    -webkit-transition: opacity 0s ease-in;
    opacity: 0;
    filter: blur(0) grayscale(0);
    image-rendering: optimizeSpeed;
    image-rendering: -moz-crisp-edges;
    image-rendering: -webkit-optimize-contrast;
    image-rendering: -o-crisp-edges;
    image-rendering: pixelated;
    -ms-interpolation-mode: nearest-neighbor;
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    margin: auto;
}

canvas.active {
    animation-name: fadeIn;
    animation-duration: 0s;
    opacity: 1;
}

@keyframes fadeIn {
    0% {
        opacity: 1;
    }

    100% {
        opacity: 1;
    }
}

@keyframes blur {
    0% {
        filter: blur(0) grayscale(0);
    }

    100% {
        filter: blur(2px) grayscale(1);
    }
}

.spinner {
    height: 30px;
    width: 30px;
    -webkit-animation: rotation 0.8s linear infinite;
    -moz-animation: rotation 0.8s linear infinite;
    -o-animation: rotation 0.8s linear infinite;
    animation: rotation 0.8s linear infinite;
    border: 5px solid #bdff00;
    border-top: 5px solid #719900;
    border-radius: 100%;
}

#status {
    display: inline-block;
    vertical-align: top;
    font-weight: bold;
    color: white;
}

#progress {
    width: 250px;
    height: 10px;
    -webkit-appearance: none;
    appearance: none;
    padding: 5px;
}

progress[value]::-webkit-progress-bar {
    background-color: #8492a6;
    height: 10px;
    border-radius: 15px;
}

progress[value]::-webkit-progress-value {
    background-image: -webkit-linear-gradient(left, #719900, #bdff00);
    height: 10px;
    border-radius: 15px;
}

.output-container {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background-color: rgba(0, 0, 0, 0.7);
    padding: 10px;
    z-index: 999;
    transition: transform 0.3s ease;
    transform: translateY(100%);
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
}

.output-container.visible {
    transform: translateY(0);
}

.output-button {
    margin: 5px;
    padding: 8px 15px;
    width: auto;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    background-color: black;
    color: white;
    outline-color: #20c20e;
    outline-style: dashed;
    font-family: "Lucida Console", Monaco, monospace;
}

#output {
    display: none;
    height: 200px;
    background-color: black;
    color: white;
    font-family: "Lucida Console", Monaco, monospace;
    outline: none;
    border: none;
    padding: 0;
    width: 100%;
}

#message-container {
    display: none;
    min-height: 50px;
    background-color: rgba(20, 20, 20, 0.5);
    outline: none;
    border: none;
    padding: 0;
    width: 100%;
    position: absolute;
    top: 0;
}

#messages {
    margin-left: 50px;
    color: white;
    font-family: "Lucida Console", Monaco, monospace;
    outline: none;
    border: none;
    padding: 0;
}

#closeUIButton {
    position: fixed;
    top: 10px;
    right: 10px;
    width: 30px;
    height: 30px;
    background-color: #000;
    color: white;
    border: none;
    border-radius: 50%;
    cursor: pointer;
    z-index: 1000;
    display: none;
    font-size: 35px;
}

.hidden-ui {
    display: none !important;
}

.save-manager-modal {
    display: none;

    position: fixed;

    z-index: 1001;

    left: 0;
    top: 0;
    width: 100%;

    height: 100%;

    overflow: auto;

    background-color: rgba(0, 0, 0, 0.8);

    justify-content: center;
    align-items: center;
}

.save-manager-content {
    background-color: #1a1a1a;
    margin: auto;
    padding: 20px;
    border: 1px solid #888;
    width: 90%;

    max-width: 800px;

    border-radius: 10px;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
    position: relative;
    display: flex;
    flex-direction: column;
    gap: 15px;
}

.close-button {
    color: #aaa;
    float: right;
    font-size: 28px;
    font-weight: bold;
    position: absolute;
    top: 10px;
    right: 20px;
    cursor: pointer;
}

.close-button:hover,
.close-button:focus {
    color: white;
    text-decoration: none;
}

.minimize-button {
    color: #aaa;
    float: right;
    font-size: 28px;
    font-weight: bold;
    position: absolute;
    top: 11px;
    right: 46px;
    cursor: pointer;
}

.minimize-button:hover,
.minimize-button:focus {
    color: white;
    text-decoration: none;
}

.save-file-list {
    max-height: 400px;

    overflow-y: auto;
    border: 1px solid #333;
    border-radius: 5px;
    padding: 10px;
    background-color: #0d0d0d;
}

.save-file-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px;
    border-bottom: 1px solid #222;
}

.save-file-item:last-child {
    border-bottom: none;
}

.save-file-info {
    flex-grow: 1;
}

.save-file-info span {
    display: block;
    margin-bottom: 5px;
}

.save-file-actions button {
    margin-left: 10px;
    padding: 5px 10px;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    background-color: #20c20e;
    color: black;
    font-weight: bold;
}

.save-file-actions button.delete-btn {
    background-color: #FA1E4E;
}

.file-upload-section {
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding-top: 15px;
    border-top: 1px solid #333;
}

.file-upload-section input[type="file"] {
    background-color: #0d0d0d;
    border: 1px solid #333;
    padding: 8px;
    border-radius: 5px;
    color: white;
}

.file-upload-section input[type="text"] {
    background-color: #0d0d0d;
    border: 1px solid #333;
    padding: 8px;
    border-radius: 5px;
    color: white;
}

.file-upload-section button {
    padding: 10px 15px;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    background-color: #007bff;
    color: white;
    font-weight: bold;
}

.custom-message-box {
    display: none;

    position: fixed;

    z-index: 1002;

    left: 0;
    top: 0;
    width: 100%;

    height: 100%;

    overflow: auto;

    background-color: rgba(0, 0, 0, 0.6);

    justify-content: center;
    align-items: center;
}

.custom-message-box-content {
    background-color: #1a1a1a;
    margin: 15% auto;
    padding: 20px;
    border: 1px solid #888;
    width: 80%;

    max-width: 400px;
    border-radius: 10px;
    text-align: center;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
}

.custom-message-box-content button {
    background-color: #20c20e;
    color: black;
    padding: 10px 20px;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    margin-top: 15px;
    font-weight: bold;
}

#mobile-controls {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: none;

    pointer-events: none;
    z-index: 100;
}

#joystick-zone {
    position: absolute;
    pointer-events: auto;
    display: flex;
    align-items: center;
    justify-content: center;

}

#button-zone {
    position: absolute;
    display: flex;
    flex-direction: column;
    justify-content: center;

    align-items: center;

    gap: 20px;

    pointer-events: auto;
}

.action-button {

    width: clamp(45px, 12vw, 80px);
    height: clamp(45px, 12vw, 80px);
    user-select: none;
    -webkit-user-select: none;
    pointer-events: auto;

    -webkit-tap-highlight-color: transparent;
    transition: opacity 0.1s ease, transform 0.1s ease;
    opacity: 0.7;

}

.action-button.pressed {
    opacity: 1.0;

    transform: scale(0.95);

}

.nipple {
    opacity: 0.7;
}

.nipple.front {
    background-color: rgba(255, 255, 255, 0.7) !important;
}

.nipple.back {
    background-color: rgba(128, 128, 128, 0.5) !important;
}

            /* ---- loading screen (in the style of the UNDERTALE port) ---- */
            #loading-overlay {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background-color: #000;
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                z-index: 9999;
                overflow: hidden;
            }
            #loading-overlay.hide { display: none; }
            #loading-overlay .spinner { display: none !important; }
            .dr-load-inner { display: flex; flex-direction: column; align-items: center; }
            #drChapter {
                font-family: 'Press Start 2P', monospace;
                font-size: 10px; color: #ffff00;
                letter-spacing: 0.22em; text-indent: 0.22em;
            }
            #drChapterName {
                font-family: 'Press Start 2P', monospace;
                font-size: 8px; color: #fff;
                letter-spacing: 0.3em; text-indent: 0.3em;
                margin-top: 12px; min-height: 8px;
            }
            #drChapterName[hidden] { display: none; }
            #drHeart { display: block; margin-top: 38px; }
            #drPct {
                margin-top: 34px;
                font-family: 'Press Start 2P', monospace;
                font-size: 18px; color: #fff;
                letter-spacing: 0.06em;
            }
            #drStage {
                margin-top: 18px;
                font-family: 'Press Start 2P', monospace;
                font-size: 8px; color: #6e6e6e;
                letter-spacing: 0.28em; text-indent: 0.28em;
                min-height: 10px; text-align: center; max-width: 92vw;
            }
            #drStage.err { color: #ff0000; letter-spacing: 0.14em; text-indent: 0.14em; }
            #drHard {
                margin-top: 14px;
                font-family: 'Press Start 2P', monospace;
                font-size: 8px; color: #ff003c;
                letter-spacing: 0.28em; text-indent: 0.28em;
            }
            #drHard[hidden] { display: none; }
            #drRetry {
                margin-top: 30px;
                font-family: 'Press Start 2P', monospace;
                font-size: 11px; color: #ff9c00;
                background: #000;
                border: 2px solid #ff9c00;
                padding: 12px 34px; cursor: pointer;
            }
            #drRetry:hover, #drRetry:focus-visible { background: #ff9c00; color: #000; }
            #loading-overlay.done #drHeartFill { animation: drflash 0.32s steps(2, jump-none) 1; }
            @keyframes drflash { 0% { fill: #fff; } 100% { fill: #ff0000; } }
            .dr-bottom {
                position: absolute; bottom: 14px; left: 0; right: 0;
                display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 22px;
                padding: 0 18px;
                font-family: 'Press Start 2P', monospace;
                font-size: 8px; color: #4a4a4a; letter-spacing: 0.12em;
            }
            .dr-bottom a { color: #4a4a4a; text-decoration: none; }
            .dr-bottom a:hover, .dr-bottom a:focus-visible { color: #9e9e9e; }
            .loading { visibility: hidden; }
            @media (max-width: 480px) {
                #drPct { font-size: 15px; }
            }
            @media (prefers-reduced-motion: reduce) {
                #loading-overlay.done #drHeartFill { animation: none; }
            }
            /* ---- small SOUL (SVG, pixel-perfect) ---- */
            .dr-soul { display: inline-block; vertical-align: middle; }
            /* ---- MODE selector (chapter-select footer, styled like the game) ---- */
            #drModeBar {
                position: fixed; z-index: 40000;
                display: flex; align-items: center; gap: 18px;
                font-family: 'Press Start 2P', monospace;
                font-size: 8px; color: #fff; letter-spacing: 0.12em;
                user-select: none; -webkit-user-select: none;
                text-shadow: 1px 1px 0 #000;
            }
            #drModeBar[hidden] { display: none; }
            .dr-mb-label { color: #9a9a9a; }
            .dr-mb-opt { display: inline-flex; align-items: center; padding: 5px 2px; cursor: pointer; }

                        if (!this.visible || !t) return;

                        if (fill) fill.setAttribute('y', String(10 - 10 * frac));

            // ============ CHAPTER CRASH FIXES (v8.1) - PULLED in v9.10 ============
            // The v8.1 ch5 "shader stubs" (bytecode no-ops for the
            // shader_replace_simple_* Windows DLL extension) are REMOVED.
            // They were never validated: ch5 could not boot from v9.1
            // until v9.3, and every build that shipped them has a FROZEN
            // intro. Runtime proof (v9.10 headless harness, default
            // config, A/B 2-4x each way): with the stubs the intro runs
            // at 0-6fps with 12s rAF gaps, the save-poll storm never
            // ends and mus/menu.ogg is never requested; with the table
            // empty the SAME build runs 25-28fps (software GL) and
            // reaches the title screen (menu.ogg ~20s), like the first
            // build. Root cause: obj_initializer2_Step_0 - the object
            // whose Step carries BOTH the save-poll AND the intro
            // room_goto - calls shader_replace_simple_set_hook, whose
            // definition lives in the exact shared code blob the stubs
            // rewrote; the stubbed hook path slows that step ~10x and
            // the transition never completes. Partial subsets of the
            // stubs crash outright (renderer death at 5-6s), so the
            // table is all-or-nothing. The game's own data handles a
            // missing DLL gracefully (the g_shader_replace_simple_ready
            // guard + the "shader_replace_simple DLL failed to load."
            // error path), and the flower-field shader crashes are fixed
            // properly - at the GLSL level - by the v9.5
            // SHADER_LOOP_FIXES, which remain live below.
            window.CHAPTER_FIX_PATCHES = {};

            // v9.5: GLSL ES 1.00 SHADER-LOOP FIXES (chapter 5). The ch5
            // Windows build ships 8 shader families whose GLSL fragment
            // code uses for-loops with UNIFORM bounds, e.g.
            //   for (float i = 0.0; i <= blur_radius; i += 1.0)
            //   for (float i = 0.0; i < paletteHeight; i++)
            //   for (float i = 0.0; i < sample_count; i += 1.0)
            //   for (float i = corner.y; i < u_Uvs.w; i += u_pixelSize.y)
            // WebGL 1 compiles shaders as GLSL ES 1.00, where a loop index
            // may only be compared against CONSTANT expressions - every one
            // of these fails with
            //   "ERROR: 'i' : Loop index cannot be compared with non-constant
            //    expression"
            // The logo blur + palette shaders are used by the ch5 INTRO:
            // with the shaders dead the intro froze/crashed a few seconds
            // into the X-marks/logo screen (the v9.3/v9.4 "ch5 intro
            // crash"). The rest (castle reflection, separable + spiral
            // blur, pixel-scan palette) would crash later areas.
            // Fix: rewrite each loop with a constant upper bound plus an
            // inner guard break/continue - the exact idiom ch5's own
            // MAX_SAMPLES/u_samples and MAX_QUALITY/q shaders already use,
            // so this is proven-compatible with the runner's compiler
            // path. Body lines absorbed into the replacement are re-emitted
            // whitespace-minified and the result padded with spaces: each
            // replacement is EXACTLY the same byte length as the original
            // text, so string-table framing, lengths and pointer tables are
            // untouched. Applied as a content search per downloaded part -
            // matches wherever the exact broken text occurs (16 sites in
            // chapter 5: each family's ES + desktop-GL variants), and is a
            // no-op on chapters 1-4 (verified: they contain none of these
            // loops). Chapters 1-4 never showed this problem.
            const SHADER_LOOP_FIXES = [["    for (float i = 0.0; i <= blur_radius; i += 1.0) {\r\n        total_color += texture2D(gm_BaseTexture, v_vTexcoord + vec2(i, 0) * texel);\r\n","    for (float i = 0.0; i < 64.0; i++) {if (blur_radius < i) break;\n\ntotal_color+=texture2D(gm_BaseTexture,v_vTexcoord+vec2(i,0)*texel);    "],["    for (float i = -blur_radius; i <= blur_radius; i += 1.0) {\r\n        total_color += texture2D(gm_BaseTexture, v_vTexcoord + vec2(i, 0) * texel);\r\n","    for (float i = -64.0; i < 64.0; i++) {if (abs(i) > blur_radius) continue;\n\ntotal_color+=texture2D(gm_BaseTexture,v_vTexcoord+vec2(i,0)*texel);   "],["    for (float i = -blur_radius; i <= blur_radius; i += 1.0) {\r\n        total_color += texture2D(gm_BaseTexture, v_vTexcoord + vec2(i * horizontal, i *(1.0-horizontal)) * texel);\r\n","    for (float i = -64.0; i < 64.0; i++) {if (abs(i) > blur_radius) continue;\n\ntotal_color+=texture2D(gm_BaseTexture,v_vTexcoord+vec2(i*horizontal,i*(1.0-horizontal))*texel);      "],["\tfor (float i = 0.0; i < paletteHeight; i++) {\r\n\t\tposA = vec2(0.0/paletteWidth, (i+0.5) / paletteHeight) * range;\r\n\t\tdist = distance(c, c2);\r\n\t\tvec4 c2 = texture2D(iPalette, pos + posA);\r\n\t\tif (abs(c.r - c2.r) < margin && abs(c.g - c2.g) < margin && abs(c.b - c2.b) < margin) {\r\n","\tfor (float i = 0.0; i < 256.0; i++) {if (paletteHeight <= i) break;\n\nposA=vec2(0.0/paletteWidth,(i+0.5)/paletteHeight)*range;\ndist=distance(c,c2);\nvec4 c2=texture2D(iPalette,pos+posA);\nif(abs(c.r-c2.r)<margin&&abs(c.g-c2.g)<margin&&abs(c.b-c2.b)<margin){                        "],["\tfor (float i = 0.0; i < paletteHeight; i++) {\r\n\t\tposA = vec2(0.0/paletteWidth, (i+0.5) / paletteHeight) * range;\r\n\t\tdist = distance(c, c2);\r\n\t\tc2 = texture2D(iPalette, pos + posA);\r\n\t\tif (abs(c.r - c2.r) < margin && abs(c.g - c2.g) < margin && abs(c.b - c2.b) < margin) {\r\n","\tfor (float i = 0.0; i < 256.0; i++) {if (paletteHeight <= i) break;\n\nposA=vec2(0.0/palet             function replaceAllBytes(bytes, f, r) {

                        : [enc.encode(MODE_TEXT_HARD), enc.encode(MODE_TEXT_ORIG)];
                    let count = 0;
                    for (const from of froms) {
                        let i = 0;
                        while (i + from.length <= heap.length) {
                            i = heap.indexOf(from[0], i);
                            if (i < 0 || i + from.length > heap.length) break;
                            let ok = true;
                            for (let j = 1; j < from.length; j++) {

            // ============ quit (chapter select) ============
            function makeMenuPicker(overlayId, optionIds, initialIndex, onConfirm) {
                const overlay = document.getElementById(overlayId);
                let index = initialIndex;
                function render() {
                    optionIds.forEach(function (oid, i) {
                        const el = document.getElementById(oid);
                        el.classList.toggle('selected', i === index);
                        const soul = el.querySelector('.dr-soul');
                        if (soul) soul.style.display = (i === index) ? '' : 'none';
                    });
                }
                function confirmChoice() {
                    cleanup();
                    overlay.classList.remove('visible');
                    onConfirm(index);
                }
                function onKey(e) {
                    if (['ArrowUp', 'ArrowLeft', 'w', 'W'].includes(e.key)) { index = (index + optionIds.length - 1) % optionIds.length; render(); e.preventDefault(); }
                    else if (['ArrowDown', 'ArrowRight', 's', 'S'].includes(e.key)) { index = (index + 1) % optionIds.length; render(); e.preventDefault(); }
                    else if (['Enter', 'z', 'Z', ' '].includes(e.key)) { confirmChoice(); e.preventDefault(); }
                }
                function onClick(e) {
                    const opt = e.target.closest('.diff-option');
                    if (!opt) return;
                    index = optionIds.indexOf(opt.id);
                    if (index < 0) return;
                    render();
                    confirmChoice();
                }
                function cleanup() {
                    document.removeEventListener('keydown', onKey);
                    overlay.removeEventListener('click', onClick);
                }
                document.addEventListener('keydown', onKey);
                overlay.addEventListener('click', onClick);
                render();
                overlay.classList.add('visible');
            }

            function doQuit() {
                try { window.close(); } catch (e) {}

            function showThanksScreen() {
                // do NOT wipe document.body - the GameMaker runtime keeps the
                // <style> tags inside <body>, nuking them kills all CSS.
                // the overlay is opaque + fixed + z-99999, it covers the game.
                try { if (typeof Module !== 'undefined' && Module.pauseMainLoop) Module.pauseMainLoop(); } catch (e) {}

                document.body.appendChild(screen);

                    handleKeyEvent: function(event) {
                        if (!this.isEnabled) return;
                        
                        const targetNode = event.target.nodeName.toLowerCase();
                        if (targetNode === 'input' || targetNode === 'textarea' || event.target.isContentEditable) {
                            return;
                        }
                        
                        const keyData = this.keyMap[event.key];
                        
                        if (keyData) {
                            
                            event.preventDefault();
                            event.stopPropagation();
                            
                            const arrowKeyEvent = new KeyboardEvent(event.type, {
                                key: keyData.key,
                                code: keyData.code,
                                bubbles: true,
                                cancelable: true,
                                composed: true,
                            });
                            
                            Object.defineProperty(arrowKeyEvent, 'keyCode', {
                                value: keyData.keyCode,
                                writable: false
                            });
                            Object.defineProperty(arrowKeyEvent, 'which', {
                                value: keyData.keyCode,
                                writable: false
                            });
                            
                            this.eventTarget.dispatchEvent(arrowKeyEvent);
                        }
                    },
                    
                    enable: function() {
                        if (this.isEnabled) return;
                        this.boundHandler = this.boundHandler || this.handleKeyEvent.bind(this);
                        
                        document.addEventListener('keydown', this.boundHandler, true);
                        document.addEventListener('keyup', this.boundHandler, true);
                        this.isEnabled = true;
                        console.log('WASD -> arrow key control has been ENABLED! Target:', this.eventTarget);
                    },
                    
                    disable: function() {
                        if (!this.isEnabled || !this.boundHandler) return;
                        document.removeEventListener('keydown', this.boundHandler, true);
                        document.removeEventListener('keyup', this.boundHandler, true);
                        this.isEnabled = false;
                        console.log('WASD -> arrow key control has been DISABLED!');
                    },
                    
                    toggle: function() {
                        if (this.isEnabled) {
                            this.disable();
                        } else {
                            this.enable();
                        }
                    }
                };

            })(window);

                async function fetchChunkRobust(chunkUrl, quiet) {
                    const expected = expectedSize(chunkUrl);
                    let total = expected > 0 ? expected : -1, pieces = [], have = 0, failures = 0, requests = 0;
                    const assemble = () => {
                        const out = new Uint8Array(have);
                        let p = 0;

                    };

                            const r = await fetchChunkRaw(chunkUrl + RUNNER_QS + '&r=' + requests, have, quiet);

                            if (expected > 0) total = expected; // repo truth beats any header
                            if (r.ranged) {

                                countedChunks.add(chunkUrl);

                top: centerTop + 'px'
            },

            color: 'white',

            if (!data || !data.vector) return;

            const x = data.vector.x;
            const y = data.vector.y;
            const threshold = 0.3;

            const newKeyState = {
                up: false,
                down: false,
                left: false,
                right: false
            };

            if (y < -threshold) newKeyState.down = true;
            if (y > threshold) newKeyState.up = true;
            if (x < -threshold) newKeyState.left = true;
            if (x > threshold) newKeyState.right = true;

            for (const dir in keyState) {
                if (keyState[dir] && !newKeyState[dir]) {
                    simulateKeyEvent('keyup', keyMap[dir].key, keyMap[dir].code);

                    simulateKeyEvent('keydown', keyMap[dir].key, keyMap[dir].code);
                }
                keyState[dir] = newKeyState[dir];
            }
        });

                }
                if (args.some(arg => typeof arg === 'string' && arg.includes('in:chapter6_mac'))) {
                    let params = new URLSearchParams(window.location.search);
                    params.set('c', '6');
                    window.location.search = params.toString();
                }
                if (args.some(arg => typeof arg === 'string' && arg.includes('in:chapter7_mac'))) {
                    let params = new URLSearchParams(window.location.search);
                    params.set('c', '7');
                    window.location.search = params.toString();
                }
                if (args.some(arg => typeof arg === 'string' && arg.includes('webquitpage'))) {
                    showQuitConfirm();
                }
            };
            document.addEventListener('DOMContentLoaded', () => {
                const fullscreenButton = document.getElementById('fullscreen');
                if (fullscreenButton) {
                    fullscreenButton.addEventListener('click', toggleFullscreen);
                }
            });
        </script>
        <script>
            const loadingOverlay = document.getElementById('loading-overlay');
            const originalLog = console.log;
            
            console.log = function(message) {
                originalLog.apply(console, arguments);
                
                if (typeof message === 'string') {
                    if (message.startsWith('Success Loaded game file') || message.indexOf('Entering main loop') >= 0) {
                        window.DREngineAlive = true;
                        if (window.DRLoading) { window.DRLoading.hide(); }
                        else if (loadingOverlay) { loadingOverlay.style.display = 'none'; }
                    }
                }
            };
        </script>
</body>
