    <style>@-webkit-keyframes rotation {
    from {
        -webkit-transform: rotate(0deg);
    }

    to {
        -webkit-transform: rotate(360deg);
    }
}

@-moz-keyframes rotation {
    from {
        -moz-transform: rotate(0deg);
    }

    to {
        -moz-transform: rotate(360deg);
    }
}

@-o-keyframes rotation {
    from {
        -o-transform: rotate(0deg);
    }

    to {
        -o-transform: rotate(360deg);
    }
}

@keyframes rotation {
    from {
        transform: rotate(0deg);
    }

    to {
        transform: rotate(360deg);
    }
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: black;
    font-family: "Lucida Console", Monaco, monospace;

    color: white;

}

#game-container {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
}

canvas.emscripten {
    display: block;
    background-color: black;
    position: absolute;
    transition: opacity 0s ease-in;
    -webkit-transition: opacity 0s ease-in;
    opacity: 0;
    filter: blur(0) grayscale(0);
    image-rendering: optimizeSpeed;
    image-rendering: -moz-crisp-edges;
    image-rendering: -webkit-optimize-contrast;
    image-rendering: -o-crisp-edges;
    image-rendering: pixelated;
    -ms-interpolation-mode: nearest-neighbor;
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    margin: auto;
}

canvas.active {
    animation-name: fadeIn;
    animation-duration: 0s;
    opacity: 1;
}

@keyframes fadeIn {
    0% {
        opacity: 1;
    }

    100% {
        opacity: 1;
    }
}

@keyframes blur {
    0% {
        filter: blur(0) grayscale(0);
    }

    100% {
        filter: blur(2px) grayscale(1);
    }
}

.spinner {
    height: 30px;
    width: 30px;
    -webkit-animation: rotation 0.8s linear infinite;
    -moz-animation: rotation 0.8s linear infinite;
    -o-animation: rotation 0.8s linear infinite;
    animation: rotation 0.8s linear infinite;
    border: 5px solid #bdff00;
    border-top: 5px solid #719900;
    border-radius: 100%;
}

#status {
    display: inline-block;
    vertical-align: top;
    font-weight: bold;
    color: white;
}

#progress {
    width: 250px;
    height: 10px;
    -webkit-appearance: none;
    appearance: none;
    padding: 5px;
}

progress[value]::-webkit-progress-bar {
    background-color: #8492a6;
    height: 10px;
    border-radius: 15px;
}

progress[value]::-webkit-progress-value {
    background-image: -webkit-linear-gradient(left, #719900, #bdff00);
    height: 10px;
    border-radius: 15px;
}

.output-container {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background-color: rgba(0, 0, 0, 0.7);
    padding: 10px;
    z-index: 999;
    transition: transform 0.3s ease;
    transform: translateY(100%);
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
}

.output-container.visible {
    transform: translateY(0);
}

.output-button {
    margin: 5px;
    padding: 8px 15px;
    width: auto;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    background-color: black;
    color: white;
    outline-color: #20c20e;
    outline-style: dashed;
    font-family: "Lucida Console", Monaco, monospace;
}

#output {
    display: none;
    height: 200px;
    background-color: black;
    color: white;
    font-family: "Lucida Console", Monaco, monospace;
    outline: none;
    border: none;
    padding: 0;
    width: 100%;
}

#message-container {
    display: none;
    min-height: 50px;
    background-color: rgba(20, 20, 20, 0.5);
    outline: none;
    border: none;
    padding: 0;
    width: 100%;
    position: absolute;
    top: 0;
}

#messages {
    margin-left: 50px;
    color: white;
    font-family: "Lucida Console", Monaco, monospace;
    outline: none;
    border: none;
    padding: 0;
}

#closeUIButton {
    position: fixed;
    top: 10px;
    right: 10px;
    width: 30px;
    height: 30px;
    background-color: #000;
    color: white;
    border: none;
    border-radius: 50%;
    cursor: pointer;
    z-index: 1000;
    display: none;
    font-size: 35px;
}

.hidden-ui {
    display: none !important;
}

.save-manager-modal {
    display: none;

    position: fixed;

    z-index: 1001;

    left: 0;
    top: 0;
    width: 100%;

    height: 100%;

    overflow: auto;

    background-color: rgba(0, 0, 0, 0.8);

    justify-content: center;
    align-items: center;
}

.save-manager-content {
    background-color: #1a1a1a;
    margin: auto;
    padding: 20px;
    border: 1px solid #888;
    width: 90%;

    max-width: 800px;

    border-radius: 10px;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
    position: relative;
    display: flex;
    flex-direction: column;
    gap: 15px;
}

.close-button {
    color: #aaa;
    float: right;
    font-size: 28px;
    font-weight: bold;
    position: absolute;
    top: 10px;
    right: 20px;
    cursor: pointer;
}

.close-button:hover,
.close-button:focus {
    color: white;
    text-decoration: none;
}

.minimize-button {
    color: #aaa;
    float: right;
    font-size: 28px;
    font-weight: bold;
    position: absolute;
    top: 11px;
    right: 46px;
    cursor: pointer;
}

.minimize-button:hover,
.minimize-button:focus {
    color: white;
    text-decoration: none;
}

.save-file-list {
    max-height: 400px;

    overflow-y: auto;
    border: 1px solid #333;
    border-radius: 5px;
    padding: 10px;
    background-color: #0d0d0d;
}

.save-file-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px;
    border-bottom: 1px solid #222;
}

.save-file-item:last-child {
    border-bottom: none;
}

.save-file-info {
    flex-grow: 1;
}

.save-file-info span {
    display: block;
    margin-bottom: 5px;
}

.save-file-actions button {
    margin-left: 10px;
    padding: 5px 10px;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    background-color: #20c20e;
    color: black;
    font-weight: bold;
}

.save-file-actions button.delete-btn {
    background-color: #FA1E4E;
}

.file-upload-section {
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding-top: 15px;
    border-top: 1px solid #333;
}

.file-upload-section input[type="file"] {
    background-color: #0d0d0d;
    border: 1px solid #333;
    padding: 8px;
    border-radius: 5px;
    color: white;
}

.file-upload-section input[type="text"] {
    background-color: #0d0d0d;
    border: 1px solid #333;
    padding: 8px;
    border-radius: 5px;
    color: white;
}

.file-upload-section button {
    padding: 10px 15px;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    background-color: #007bff;
    color: white;
    font-weight: bold;
}

.custom-message-box {
    display: none;

    position: fixed;

    z-index: 1002;

    left: 0;
    top: 0;
    width: 100%;

    height: 100%;

    overflow: auto;

    background-color: rgba(0, 0, 0, 0.6);

    justify-content: center;
    align-items: center;
}

.custom-message-box-content {
    background-color: #1a1a1a;
    margin: 15% auto;
    padding: 20px;
    border: 1px solid #888;
    width: 80%;

    max-width: 400px;
    border-radius: 10px;
    text-align: center;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
}

.custom-message-box-content button {
    background-color: #20c20e;
    color: black;
    padding: 10px 20px;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    margin-top: 15px;
    font-weight: bold;
}

#mobile-controls {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: none;

    pointer-events: none;
    z-index: 100;
}

#joystick-zone {
    position: absolute;
    pointer-events: auto;
    display: flex;
    align-items: center;
    justify-content: center;

}

#button-zone {
    position: absolute;
    display: flex;
    flex-direction: column;
    justify-content: center;

    align-items: center;

    gap: 20px;

    pointer-events: auto;
}

.action-button {

    width: clamp(45px, 12vw, 80px);
    height: clamp(45px, 12vw, 80px);
    user-select: none;
    -webkit-user-select: none;
    pointer-events: auto;

    -webkit-tap-highlight-color: transparent;
    transition: opacity 0.1s ease, transform 0.1s ease;
    opacity: 0.7;

}

.action-button.pressed {
    opacity: 1.0;

    transform: scale(0.95);

}

.nipple {
    opacity: 0.7;
}

.nipple.front {
    background-color: rgba(255, 255, 255, 0.7) !important;
}

.nipple.back {
    background-color: rgba(128, 128, 128, 0.5) !important;
}

            /* ---- loading screen (in the style of the UNDERTALE port) ---- */
            #loading-overlay {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background-color: #000;
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                z-index: 9999;
                overflow: hidden;
            }
            #loading-overlay.hide { display: none; }
            #loading-overlay .spinner { display: none !important; }
            .dr-load-inner { display: flex; flex-direction: column; align-items: center; }
            #drChapter {
                font-family: 'Press Start 2P', monospace;
                font-size: 10px; color: #ffff00;
                letter-spacing: 0.22em; text-indent: 0.22em;
            }
            #drChapterName {
                font-family: 'Press Start 2P', monospace;
                font-size: 8px; color: #fff;
                letter-spacing: 0.3em; text-indent: 0.3em;
                margin-top: 12px; min-height: 8px;
            }
            #drChapterName[hidden] { display: none; }
            #drHeart { display: block; margin-top: 38px; }
            #drPct {
                margin-top: 34px;
                font-family: 'Press Start 2P', monospace;
                font-size: 18px; color: #fff;
                letter-spacing: 0.06em;
            }
            #drStage {
                margin-top: 18px;
                font-family: 'Press Start 2P', monospace;
                font-size: 8px; color: #6e6e6e;
                letter-spacing: 0.28em; text-indent: 0.28em;
                min-height: 10px; text-align: center; max-width: 92vw;
            }
            #drStage.err { color: #ff0000; letter-spacing: 0.14em; text-indent: 0.14em; }
            #drHard {
                margin-top: 14px;
                font-family: 'Press Start 2P', monospace;
                font-size: 8px; color: #ff003c;
                letter-spacing: 0.28em; text-indent: 0.28em;
            }
            #drHard[hidden] { display: none; }
            #drRetry {
                margin-top: 30px;
                font-family: 'Press Start 2P', monospace;
                font-size: 11px; color: #ff9c00;
                background: #000;
                border: 2px solid #ff9c00;
                padding: 12px 34px; cursor: pointer;
            }
            #drRetry:hover, #drRetry:focus-visible { background: #ff9c00; color: #000; }
            #loading-overlay.done #drHeartFill { animation: drflash 0.32s steps(2, jump-none) 1; }
            @keyframes drflash { 0% { fill: #fff; } 100% { fill: #ff0000; } }
            .dr-bottom {
                position: absolute; bottom: 14px; left: 0; right: 0;
                display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 22px;
                padding: 0 18px;
                font-family: 'Press Start 2P', monospace;
                font-size: 8px; color: #4a4a4a; letter-spacing: 0.12em;
            }
            .dr-bottom a { color: #4a4a4a; text-decoration: none; }
            .dr-bottom a:hover, .dr-bottom a:focus-visible { color: #9e9e9e; }
            .loading { visibility: hidden; }
            @media (max-width: 480px) {
                #drPct { font-size: 15px; }
            }
            @media (prefers-reduced-motion: reduce) {
                #loading-overlay.done #drHeartFill { animation: none; }
            }
            /* ---- small SOUL (SVG, pixel-perfect) ---- */
            .dr-soul { display: inline-block; vertical-align: middle; }
            /* ---- quit overlay ---- */
            #quit-overlay {
                position: fixed; inset: 0; z-index: 99999;
                background: #000; display: none;
                flex-direction: column; justify-content: center; align-items: center;
                font-family: 'Press Start 2P', monospace; color: #fff;
                text-align: center;
            }
            #quit-overlay.visible { display: flex; }
            .diff-title { font-size: 14px; letter-spacing: 0.12em; text-indent: 0.12em; margin-bottom: 24px; color: #fff; }
            .diff-option { font-size: 11px; letter-spacing: 0.06em; padding: 12px 30px; cursor: pointer; display: flex; align-items: center; min-width: 240px; }

            // 2x damage + 1.2x enemy attack speed, applied to the chapter file
            // when it loads. Toggled from the chapter select screen itself:
            // a native obj_ui_choice ("NORMAL"/"HARD") joins the footer row
            // next to QUIT and LANGUAGE, drawn by the game, navigated with
            // the same left/right + confirm keys, and wired back to this
            // page through the game's own show_debug_message output.
            const HARD_MODE_STORAGE_KEY = 'dr_webport_hardmode';
            let hardModeActive = (function () {
                try { return localStorage.getItem(HARD_MODE_STORAGE_KEY) === '1'; } catch (e) { return false; }
            })();

            // The game's own version line (obj_ui_version, bottom-left of the
            // chapter select). Original is 24 bytes; replacements are exactly
            // 24 bytes too, so only content bytes ever change.
            const MODE_TEXT_ORIG = 'DR Web Port By Kantasu  ';
            const MODE_TEXT_HARD = 'kantasu [HARD]         ';
            const MODE_TEXT_NORMAL = 'kantasu                ';
            function modeTextFor(on) { return on ? MODE_TEXT_HARD : MODE_TEXT_NORMAL; }
            function modeTextBytes() {
                const t = modeTextFor(hardModeActive);
                const b = new Uint8Array(24);
                for (let i = 0; i < 24; i++) b[i] = i < t.length ? t.charCodeAt(i) : 32;
                return b;
            }

            // bake the mode text into the assembled chapter-select archive
            function applyModeTextPatch(bytes) {
                const orig = new TextEncoder().encode(MODE_TEXT_ORIG);
                const repl = modeTextBytes();
                outer:
                for (let i = 0; i + orig.length <= bytes.length; i++) {
                    for (let j = 0; j < orig.length; j++) {
                        if (bytes[i + j] !== orig[j]) continue outer;
                    }
                    bytes.set(repl, i);
                }
            }

            // live rewrite inside the GameMaker WASM heap (instant, no reload).
            // the runner keeps a couple of copies of the archive in memory, so
            // every copy gets rewritten; the game redraws the line next frame.
            function updateLiveModeText() {
                try {
                    const M = window.Module;
                    const heap = M && M.HEAPU8;
                    if (!heap || !heap.length) return false;
                    const enc = new TextEncoder();
                    const to = modeTextBytes();
                    const froms = hardModeActive
                        ? [enc.encode(MODE_TEXT_NORMAL), enc.encode(MODE_TEXT_ORIG)]
                        : [enc.encode(MODE_TEXT_HARD), enc.encode(MODE_TEXT_ORIG)];
                    let count = 0;
                    for (const from of froms) {
                        let i = 0;
                        while (i + from.length <= heap.length) {
                            i = heap.indexOf(from[0], i);
                            if (i < 0 || i + from.length > heap.length) break;
                            let ok = true;
                            for (let j = 1; j < from.length; j++) {
                                if (heap[i + j] !== from[j]) { ok = false; break; }
                            }
                            if (ok) { heap.set(to, i); count++; }
                            i++;
                        }
                    }
                    return count > 0;
                } catch (e) { return false; }
            }

            // the in-game MODE choice reports back through the game's own
            // debug console output ("drmode:hard" / "drmode:normal"); the
            // console.log hook in this page picks it up and calls setMode.
            window.DRHardMode = {
                setMode: function (on) {
                    hardModeActive = !!on;
                    try { localStorage.setItem(HARD_MODE_STORAGE_KEY, on ? '1' : '0'); } catch (e) {}
                    updateLiveModeText();
                }
            };

            // ============ quit (chapter select) ============
            function makeMenuPicker(overlayId, optionIds, initialIndex, onConfirm) {
                const overlay = document.getElementById(overlayId);
                let index = initialIndex;
                function render() {
                    optionIds.forEach(function (oid, i) {
                        const el = document.getElementById(oid);
                        el.classList.toggle('selected', i === index);
                        const soul = el.querySelector('.dr-soul');
                        if (soul) soul.style.display = (i === index) ? '' : 'none';
                    });
                }
                function confirmChoice() {
                    cleanup();
                    overlay.classList.remove('visible');
                    onConfirm(index);
                }
                function onKey(e) {
                    if (['ArrowUp', 'ArrowLeft', 'w', 'W'].includes(e.key)) { index = (index + optionIds.length - 1) % optionIds.length; render(); e.preventDefault(); }
                    else if (['ArrowDown', 'ArrowRight', 's', 'S'].includes(e.key)) { index = (index + 1) % optionIds.length; render(); e.preventDefault(); }
                    else if (['Enter', 'z', 'Z', ' '].includes(e.key)) { confirmChoice(); e.preventDefault(); }
                }
                function onClick(e) {
                    const opt = e.target.closest('.diff-option');
                    if (!opt) return;
                    index = optionIds.indexOf(opt.id);
                    if (index < 0) return;
                    render();
                    confirmChoice();
                }
                function cleanup() {
                    document.removeEventListener('keydown', onKey);
                    overlay.removeEventListener('click', onClick);
                }
                document.addEventListener('keydown', onKey);
                overlay.addEventListener('click', onClick);
                render();
                overlay.classList.add('visible');
            }

            function showQuitConfirm() {
                makeMenuPicker('quit-overlay', ['quit-yes', 'quit-no'], 0, function (idx) {
                    if (idx === 0) doQuit();
                });
            }

            function doQuit() {
                try { window.close(); } catch (e) {}
                setTimeout(function () {
                    if (!window.closed) showThanksScreen();
                }, 250);
            }

            function showThanksScreen() {
                // do NOT wipe document.body - the GameMaker runtime keeps the
                // <style> tags inside <body>, nuking them kills all CSS.
                // the overlay is opaque + fixed + z-99999, it covers the game.
                try { if (typeof Module !== 'undefined' && Module.pauseMainLoop) Module.pauseMainLoop(); } catch (e) {}
                try { GM_pause(); } catch (e) {}
                const screen = document.createElement('div');
                screen.className = 'thanks-screen';
                screen.innerHTML = '<div class="thanks-title">' + DR_SOUL + '<div>THANK  YOU  FOR  PLAYING</div></div>' +
                    '<div class="thanks-sub">YOU CAN CLOSE THIS TAB NOW.</div>' +
                    '<a href="?c=0">&gt; BACK TO CHAPTER SELECT</a>';
                document.body.appendChild(screen);
            }

            (function(window) {
                const WASD_CONTROLLER = {
                    isEnabled: false,
                    boundHandler: null,
                    
                    eventTarget: document.body,
                    
                    keyMap: {
                        'w': {
                            key: 'ArrowUp',
                            code: 'ArrowUp',
                            keyCode: 38
                        },
                        'a': {
                            key: 'ArrowLeft',
                            code: 'ArrowLeft',
                            keyCode: 37
                        },
                        's': {
                            key: 'ArrowDown',
                            code: 'ArrowDown',
                            keyCode: 40
                        },
                        'd': {
                            key: 'ArrowRight',
                            code: 'ArrowRight',
                            keyCode: 39
                        },
                        'W': {
                            key: 'ArrowUp',
                            code: 'ArrowUp',
                            keyCode: 38
                        },
                        'A': {
                            key: 'ArrowLeft',
                            code: 'ArrowLeft',
                            keyCode: 37
                        },
                        'S': {
                            key: 'ArrowDown',
                            code: 'ArrowDown',
                            keyCode: 40
                        },
                        'D': {
                            key: 'ArrowRight',
                            code: 'ArrowRight',
                            keyCode: 39
                        }
                    },
                    
                    handleKeyEvent: function(event) {
                        if (!this.isEnabled) return;
                        
                        const targetNode = event.target.nodeName.toLowerCase();
                        if (targetNode === 'input' || targetNode === 'textarea' || event.target.isContentEditable) {
                            return;
                        }
                        
                        const keyData = this.keyMap[event.key];
                        
                        if (keyData) {
                            
                            event.preventDefault();
                            event.stopPropagation();
                            
                            const arrowKeyEvent = new KeyboardEvent(event.type, {
                                key: keyData.key,
                                code: keyData.code,
                                bubbles: true,
                                cancelable: true,
                                composed: true,
                            });
                            
                            Object.defineProperty(arrowKeyEvent, 'keyCode', {
                                value: keyData.keyCode,
                                writable: false
                            });
                            Object.defineProperty(arrowKeyEvent, 'which', {
                                value: keyData.keyCode,
                                writable: false
                            });
                            
                            this.eventTarget.dispatchEvent(arrowKeyEvent);
                        }
                    },
                    
                    enable: function() {
                        if (this.isEnabled) return;
                        this.boundHandler = this.boundHandler || this.handleKeyEvent.bind(this);
                        
                        document.addEventListener('keydown', this.boundHandler, true);
                        document.addEventListener('keyup', this.boundHandler, true);
                        this.isEnabled = true;
                        console.log('WASD -> arrow key control has been ENABLED! Target:', this.eventTarget);
                    },
                    
                    disable: function() {
                        if (!this.isEnabled || !this.boundHandler) return;
                        document.removeEventListener('keydown', this.boundHandler, true);
                        document.removeEventListener('keyup', this.boundHandler, true);
                        this.isEnabled = false;
                        console.log('WASD -> arrow key control has been DISABLED!');
                    },
                    
                    toggle: function() {
                        if (this.isEnabled) {
                            this.disable();
                        } else {
                            this.enable();
                        }
                    }
                };
                
                window.toggleWASD = WASD_CONTROLLER.toggle.bind(WASD_CONTROLLER);
                
            })(window);
        </script>

            var Module = {
                preRun: [],

                print: (function() {
                    var element = document.getElementById("output");
                    if (element) element.value = "";
                    return function(text) {
                        if (text === "Starting WAD") {
                            loadprogress += 1;
                        }
                        if (loadprogress === 1) {
                            Module.setStatus(text);
                        } else if (loadprogress >= 2) {
                            Module.setStatus("");
                        }
                        if (arguments.length > 1) text = Array.prototype.slice.call(arguments).join(" ");
                        if (text != CONSOLE_layer_set_visible && text != CONSOLE_layer_tilemap_get_id && text != CONSOLE_layer_depth && text != CONSOLE_draw_tilemap && text != CONSOLE_layer_get_all_elements) {
                            console.log(text);

                            ensureAspectRatio();

                            if (text != CONSOLE_layer_set_visible && text != CONSOLE_layer_tilemap_get_id && text != CONSOLE_layer_depth && text != CONSOLE_draw_tilemap && text != CONSOLE_layer_get_all_elements) {

                printErr: function(text) {

                canvas: (function() {
                    return document.getElementById("canvas");
                })(),
                setStatus: function(text) {
                    if (!Module.setStatus.last) Module.setStatus.last = {
                        time: Date.now(),
                        text: ""
                    };
                    if (text === Module.setStatus.last.text) return;
                    var m = text.match(/([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/);
                    var now = Date.now();
                    if (m && now - Module.setStatus.last.time < 30) return;
                    Module.setStatus.last.time = now;
                    Module.setStatus.last.text = text;
                    if (m) {
                        text = m[1];
                        progressElement.value = parseInt(m[2]) * 100;
                        progressElement.max = parseInt(m[4]) * 100;
                        progressElement.hidden = false;
                        spinnerElement.hidden = false;
                    } else {
                        progressElement.value = null;
                        progressElement.max = null;
                        progressElement.hidden = true;
                        if (!text) {
                            spinnerElement.style.display = "none";
                            canvasElement.style.display = "block";
                        }
                    }
                    statusElement.innerHTML = text;

                        messageBox.style.display = 'none';
                        if (onConfirm) onConfirm();
                    };
                }
                
                function confirmBox(message) {
                    return new Promise((resolve) => {
                        const messageBox = document.getElementById('customMessageBox');
                        const messageBoxText = document.getElementById('messageBoxText');
                        const messageBoxConfirmBtn = document.getElementById('messageBoxConfirmBtn');
                        let messageBoxCancelBtn = document.getElementById('messageBoxCancelBtn');
                        if (!messageBoxCancelBtn) {
                            messageBoxCancelBtn = document.createElement('button');
                            messageBoxCancelBtn.id = 'messageBoxCancelBtn';
                            messageBoxCancelBtn.style.backgroundColor = '#6c757d';
                            messageBoxCancelBtn.style.marginLeft = '10px';
                            messageBoxConfirmBtn.parentNode.appendChild(messageBoxCancelBtn);
                        }
                        messageBoxText.textContent = message;
                        messageBoxConfirmBtn.textContent = 'Sure!';
                        messageBoxCancelBtn.textContent = 'Nah.';
                        messageBoxCancelBtn.style.display = 'inline-block';
                        messageBox.style.display = 'flex';
                        messageBoxConfirmBtn.onclick = () => {
                            messageBox.style.display = 'none';
                            resolve(true);
                        };
                        messageBoxCancelBtn.onclick = () => {
                            messageBox.style.display = 'none';
                            resolve(false);
                        };
                    });
                }
                const DB_NAME = '/_savedata';
                const STORE_NAME = 'FILE_DATA';
                const DB_VERSION = 21;
                let db;
                async function openIndexedDB() {
                    if (db) return db;
                    if (!window.indexedDB) {
                        showMessageBox("Your browser doesn't support IndexedDB. Save manager will not work.");
                        throw new Error("IndexedDB not supported.");
                    }
                    return new Promise((resolve, reject) => {
                        const request = indexedDB.open(DB_NAME, DB_VERSION);
                        request.onerror = (event) => {
                            //console.error("IndexedDB error:", event.target.error);
                            //showMessageBox("Error opening IndexedDB: " + (event.target.error ? event.target.error.message : "Unknown error"));
                            reject("Error opening IndexedDB.");
                        };
                        request.onsuccess = (event) => {
                            db = event.target.result;
                            db.onversionchange = () => {
                                try { db.close(); } catch (e) {}
                                db = null;
                            };
                            console.log("IndexedDB opened successfully.");
                            resolve(db);
                        };
                        request.onupgradeneeded = (event) => {
                            db = event.target.result;
                            if (!db.objectStoreNames.contains(STORE_NAME)) {
                                db.createObjectStore(STORE_NAME);
                                console.log(`Object store '${STORE_NAME}' created.`);
                            }
                        };
                    });
                }
                async function getSaveFiles() {
                    try {
                        await openIndexedDB();
                        const transaction = db.transaction([STORE_NAME], 'readonly');
                        const objectStore = transaction.objectStore(STORE_NAME);
                        const request = objectStore.getAll();
                        return new Promise((resolve, reject) => {
                            request.onsuccess = (event) => {
                                const files = event.target.result;
                                const fileNamesRequest = objectStore.getAllKeys();
                                fileNamesRequest.onsuccess = (eventKeys) => {
                                    const fileNames = eventKeys.target.result;
                                    const result = files.map((file, index) => ({
                                        name: fileNames[index],
                                        data: file
                                    }));
                                    resolve(result);
                                };
                                fileNamesRequest.onerror = (eventKeys) => {
                                    console.error("Error getting file names:", eventKeys.target.error);
                                    reject("Error getting file names: " + (eventKeys.target.error ? eventKeys.target.error.message : "Unknown error"));
                                };
                            };
                            request.onerror = (event) => {
                                console.error("Error getting save files from object store:", event.target.error);
                                reject("Error getting save files: " + (event.target.error ? event.target.error.message : "Unknown error"));
                            };
                        });
                    } catch (error) {
                        console.error("Error in getSaveFiles:", error);
                        showMessageBox("Failed to retrieve save files: " + error.message);
                        return [];
                    }
                }
                async function displaySaveFiles() {
                    const saveFileListDiv = document.getElementById('saveFileList');
                    saveFileListDiv.innerHTML = '';
                    try {
                        const files = await getSaveFiles();
                        if (files.length === 0) {
                            saveFileListDiv.innerHTML = 'No saves found. Try importing one or saving in-game first.';
                            return;
                        }
                        files.forEach(fileEntry => {
                            const fileName = fileEntry.name;
                            const fileData = fileEntry.data;
                            const itemDiv = document.createElement('div');
                            itemDiv.classList.add('save-file-item');
                            const infoDiv = document.createElement('div');
                            infoDiv.classList.add('save-file-info');
                            const timestamp = fileData.timestamp ? new Date(fileData.timestamp).toLocaleString() : 'N/A';
                            const size = fileData.contents ? fileData.contents.byteLength : 0;
                            infoDiv.innerHTML = `
                      
                          
                          
                                      <span>
                                          <strong>File:</strong> ${fileName}
                          
                          
                                      </span>
                                      <span>
                                          <strong>Last Modified:</strong> ${timestamp}
                          
                          
                                      </span>
                                      <span>
                                          <strong>Size:</strong> ${size} bytes
                          
                          
                                      </span>
                    `;
                    const actionsDiv = document.createElement('div');
                    actionsDiv.classList.add('save-file-actions');
                    const downloadBtn = document.createElement('button');
                    downloadBtn.textContent = 'Download';
                    downloadBtn.onclick = () => downloadSaveFile(fileName, fileData.contents);
                    actionsDiv.appendChild(downloadBtn);
                    const deleteBtn = document.createElement('button');
                    deleteBtn.textContent = 'Delete';
                    deleteBtn.classList.add('delete-btn');
                    deleteBtn.onclick = async () => {
                        const confirmed = await confirmBox(`Are you sure you want to delete "${fileName}"?`);
                        if (confirmed) {
                            await deleteSaveFile(fileName);
                        }
                    };
                    actionsDiv.appendChild(deleteBtn);
                    itemDiv.appendChild(infoDiv);
                    itemDiv.appendChild(actionsDiv);
                    saveFileListDiv.appendChild(itemDiv);
                        });
                    } catch (error) {
                        console.error("Error displaying save files:", error);
                        saveFileListDiv.innerHTML = `
                                      
                                      
                                      <p style="text-align: center; color: #FA1E4E;">Error loading files: ${error.message}</p>`;
                    }
                }
                
                function downloadSaveFile(fileName, contents) {
                    if (!contents) {
                        showMessageBox("No content to download for this file.");
                        return;
                    }
                    const blob = new Blob([contents], {
                        type: 'application/octet-stream'
                    });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = fileName;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                    showMessageBox(`File "${fileName}" downloaded.`);
                }
                async function deleteSaveFile(fileName) {
                    try {
                        await openIndexedDB();
                        const transaction = db.transaction([STORE_NAME], 'readwrite');
                        const objectStore = transaction.objectStore(STORE_NAME);
                        const request = objectStore.delete(fileName);
                        return new Promise((resolve, reject) => {
                            request.onsuccess = () => {
                                showMessageBox(`File "${fileName}" deleted successfully.`);
                                displaySaveFiles();
                                resolve();
                            };
                            request.onerror = (event) => {
                                console.error("Error deleting file:", event.target.error);
                                showMessageBox(`Error deleting file "${fileName}": ` + (event.target.error ? event.target.error.message : "Unknown error"));
                                reject("Error deleting file.");
                            };
                        });
                    } catch (error) {
                        console.error("Error in deleteSaveFile:", error);
                        showMessageBox("Failed to delete save file: " + error.message);
                    }
                }
                async function handleUpload() {
                    const uploadFileInput = document.getElementById('uploadFileInput');
                    const uploadFileNameInput = document.getElementById('uploadFileNameInput');
                    const files = uploadFileInput.files;
                    if (files.length === 0) {
                        showMessageBox("Please select at least one file to upload.");
                        return;
                    }
                    try {
                        const uploadPromises = [];
                        for (let i = 0; i < files.length; i++) {
                            const file = files[i];
                            let fileName = (files.length === 1 && uploadFileNameInput.value.trim())
                            ? uploadFileNameInput.value.trim()
                            : file.name;
                            fileName = fileName.replace(/^_savedata\//, '');
                            fileName = fileName.replace(/^\//, '');
                            if (!fileName) {
                                showMessageBox(`Invalid file name for "${file.name}" after processing. Skipping.`);
                                continue;
                            }
                            const arrayBuffer = await file.arrayBuffer();
                            const uint8ArrayContents = new Uint8Array(arrayBuffer);
                            const saveObject = {
                                timestamp: new Date(),
                                mode: 33206,
                                contents: uint8ArrayContents
                            };
                            const finalFileName = `/_savedata/${fileName}`;
                            uploadPromises.push(saveSaveFile(finalFileName, saveObject));
                        }
                        await Promise.all(uploadPromises);
                        showMessageBox(`${files.length} file(s) uploaded and saved successfully.`);
                        uploadFileInput.value = '';
                        uploadFileNameInput.value = '';
                        displaySaveFiles();
                    } catch (error) {
                        console.error("Error uploading file(s):", error);
                        showMessageBox("Failed to upload one or more files: " + error.message);
                    }
                }
                async function exportAllToZip() {
                    try {
                        const files = await getSaveFiles();
                        if (files.length === 0) {
                            showMessageBox("No save files to export.");
                            return;
                        }
                        const zip = new JSZip();
                        files.forEach(fileEntry => {
                            const fileName = fileEntry.name.replace(/^\/_savedata\//, ''); // Clean up name for ZIP
                            const contents = fileEntry.data.contents;
                            if (contents) {
                                const zipContents = (contents instanceof Int8Array)
                                ? new Uint8Array(contents.buffer)  // Convert if old Int8Array
                                : contents;  // Already Uint8Array or compatible
                                zip.file(fileName, zipContents);
                            }
                        });
                        const zipBlob = await zip.generateAsync({ type: 'blob' });
                        const url = URL.createObjectURL(zipBlob);
                        const a = document.createElement('a');
                        a.href = url;
                        a.download = 'deltarune_saves.zip';
                        document.body.appendChild(a);
                        a.click();
                        document.body.removeChild(a);
                        URL.revokeObjectURL(url);
                        showMessageBox("All save files exported to deltarune_saves.zip.");
                    } catch (error) {
                        console.error("Error exporting to ZIP:", error);
                        showMessageBox("Failed to export to ZIP: " + error.message);
                    }
                }
                async function saveSaveFile(fileName, data) {
                    try {
                        await openIndexedDB();
                        const transaction = db.transaction([STORE_NAME], 'readwrite');
                        const objectStore = transaction.objectStore(STORE_NAME);
                        const request = objectStore.put(data, fileName);
                        return new Promise((resolve, reject) => {
                            request.onsuccess = () => {
                                resolve();
                            };
                            request.onerror = (event) => {
                                console.error("Error saving file:", event.target.error);
                                showMessageBox("Error saving file: " + (event.target.error ? event.target.error.message : "Unknown error"));
                                reject("Error saving file.");
                            };
                        });
                    } catch (error) {
                        console.error("Error in saveSaveFile:", error);
                        showMessageBox("Failed to save file: " + error.message);
                    }
                }
                async function openSaveManager() {
                    const saveManagerModal = document.getElementById('saveManagerModal');
                    saveManagerModal.style.display = 'flex';
                    await displaySaveFiles();
                    try { GM_pause(); } catch (e) {}
                }
                
                function closeSaveManager() {
                    window.location.reload();
                    const saveManagerModal = document.getElementById('saveManagerModal');
                    saveManagerModal.style.display = 'none';
                }
                
                function closeSMnoreload() {
                    const saveManagerModal = document.getElementById('saveManagerModal');
                    saveManagerModal.style.display = 'none';
                    try { GM_unpause(); } catch (e) {}
                }
                let uploadFileNameInput = null;
                
                function protectInputFromGame(e) {
                    if (uploadFileNameInput && document.activeElement === uploadFileNameInput) {
                        e.stopImmediatePropagation();
                    }
                }
                document.addEventListener('DOMContentLoaded', () => {
                    uploadFileNameInput = document.getElementById('uploadFileNameInput');
                    const uploadFileInput = document.getElementById('uploadFileInput');
                    
                    if (uploadFileInput && uploadFileNameInput) {
                        if (uploadFileInput && uploadFileNameInput) {
                            uploadFileInput.addEventListener('change', () => {
                                if (uploadFileInput.files.length === 1) {
                                    uploadFileNameInput.disabled = false;
                                    uploadFileNameInput.value = uploadFileInput.files[0].name;
                                    uploadFileNameInput.placeholder = 'Enter the corresponding filename (e.g., filech1_0, dr.ini / for single file only)';
                                } else {
                                    uploadFileNameInput.disabled = true;
                                    uploadFileNameInput.value = '';
                                    uploadFileNameInput.placeholder = 'Custom filenames do not work when selecting multiple files!';
                                }
                            });
                        }
                    }
                    if (uploadFileNameInput) {
                        window.addEventListener('keydown', protectInputFromGame, true);
                        window.addEventListener('keyup', protectInputFromGame, true);
                        window.addEventListener('keypress', protectInputFromGame, true);
                    }
                });
                return {
                    openSaveManager: openSaveManager,
                    closeSaveManager: closeSaveManager,
                    closeSMnoreload: closeSMnoreload,
                    handleUpload: handleUpload,
                    showMessageBox: showMessageBox,
                    confirmBox: confirmBox,
                    openIndexedDB: openIndexedDB,
                    exportAllToZip: exportAllToZip

            })();
            window.addEventListener('load', async () => {
                try {
                    await window.DeltaruneSaveManager.openIndexedDB();
                } catch (error) {
                    console.error("Failed to initialize IndexedDB on load:", error);
                }
            });

            function simulateKeyEvent(eventType, key, keyCode) {
                const event = new KeyboardEvent(eventType, {
                    key: key,
                    keyCode: keyCode,
                    which: keyCode,
                    bubbles: true,
                    cancelable: true,
                });

        <script>
		window.addEventListener('load', () => {

    function isMobileDevice() {

        if (navigator.userAgentData && navigator.userAgentData.mobile) {
            return true;
        }

        const mobileRegex = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i;
        return mobileRegex.test(navigator.userAgent);
    }

    if (!isMobileDevice()) {
        return;
    }

    let tapCount = 0;
    let tapTimer = null;
    const requiredTaps = 5;
    const tapTimeout = 400;

    document.body.addEventListener('touchstart', (e) => {

        if (e.target.closest('#button-zone') || e.target.closest('#joystick-zone')) {
            return;
        }

        tapCount++;

        clearTimeout(tapTimer);

        tapTimer = setTimeout(() => {
            tapCount = 0;
        }, tapTimeout);

        if (tapCount >= requiredTaps) {

            if (typeof showUI === 'function') {
                showUI();
            }

            tapCount = 0;
            clearTimeout(tapTimer);
        }
    });

    const mobileControls = document.getElementById('mobile-controls');
    if (mobileControls) {
        mobileControls.style.display = 'block';
    }

    const buttonZone = document.getElementById('button-zone');
    const joystickZone = document.getElementById('joystick-zone');
    const keyState = {
        up: false,
        down: false,
        left: false,
        right: false
    };
    const keyMap = {
        up: {
            key: 'ArrowUp',
            code: 38
        },
        down: {
            key: 'ArrowDown',
            code: 40
        },
        left: {
            key: 'ArrowLeft',
            code: 37
        },
        right: {
            key: 'ArrowRight',
            code: 39
        }
    };
    let joystick = null;

    function createOrUpdateJoystick() {
        if (joystick) {
            joystick.destroy();
        }
        if (!joystickZone) return;
        const zoneRect = joystickZone.getBoundingClientRect();
        if (zoneRect.width === 0 || zoneRect.height === 0) {
            console.warn('joystickZone has zero size, skipping joystick creation');
            return;
        }

        const joystickSize = Math.max(100, Math.min(zoneRect.width, zoneRect.height) * 0.6);
        const centerLeft = zoneRect.width / 2;
        const centerTop = zoneRect.height / 2;
        joystick = nipplejs.create({
            zone: joystickZone,
            mode: 'static',
            position: {
                left: centerLeft + 'px',
                top: centerTop + 'px'
            },
            size: joystickSize,
            color: 'white',
            threshold: 0.2
        });

        joystick.on('move', (evt, data) => {
            if (!data || !data.vector) return;

            const x = data.vector.x;
            const y = data.vector.y;
            const threshold = 0.3;

            const newKeyState = {
                up: false,
                down: false,
                left: false,
                right: false
            };

            if (y < -threshold) newKeyState.down = true;
            if (y > threshold) newKeyState.up = true;
            if (x < -threshold) newKeyState.left = true;
            if (x > threshold) newKeyState.right = true;

            for (const dir in keyState) {
                if (keyState[dir] && !newKeyState[dir]) {
                    simulateKeyEvent('keyup', keyMap[dir].key, keyMap[dir].code);
                } else if (!keyState[dir] && newKeyState[dir]) {
                    simulateKeyEvent('keydown', keyMap[dir].key, keyMap[dir].code);
                }
                keyState[dir] = newKeyState[dir];
            }
        });

        joystick.on('end', () => {
            for (const dir in keyState) {
                if (keyState[dir]) {
                    simulateKeyEvent('keyup', keyMap[dir].key, keyMap[dir].code);
                    keyState[dir] = false;
                }
            }
        });
    }

        <script>
            function toggleFullscreen() {
                const doc = document;
                const docEl = doc.documentElement;
                
                const isInFullscreen = () =>
                doc.fullscreenElement ||
                doc.webkitFullscreenElement ||
                doc.mozFullScreenElement ||
                doc.msFullscreenElement;
                
                const requestFullscreen = () => {
                    if (docEl.requestFullscreen) docEl.requestFullscreen();
                    else if (docEl.webkitRequestFullscreen) docEl.webkitRequestFullscreen();
                    else if (docEl.mozRequestFullScreen) docEl.mozRequestFullScreen();
                    else if (docEl.msRequestFullscreen) docEl.msRequestFullscreen();
                };
                
                const exitFullscreen = () => {
                    if (doc.exitFullscreen) doc.exitFullscreen();
                    else if (doc.webkitExitFullscreen) doc.webkitExitFullscreen();
                    else if (doc.mozCancelFullScreen) doc.mozCancelFullScreen();
                    else if (doc.msExitFullscreen) doc.msExitFullscreen();
                };
                
                if (!isInFullscreen()) {
                    requestFullscreen();
                } else {
                    exitFullscreen();
                }
            }
            const originalConsoleLog = console.log;
            console.log = function(...args) {
                originalConsoleLog.apply(console, args);
                
                /* hard mode toggle: the game's native MODE choice reports here */
                if (args.some(arg => typeof arg === 'string' && arg.includes('drmode:hard'))) {
                    if (window.DRHardMode) window.DRHardMode.setMode(true);
                }
                if (args.some(arg => typeof arg === 'string' && arg.includes('drmode:normal'))) {
                    if (window.DRHardMode) window.DRHardMode.setMode(false);
                }

        <script>
            const loadingOverlay = document.getElementById('loading-overlay');
            const originalLog = console.log;
            
            console.log = function(message) {
                originalLog.apply(console, arguments);
                
                if (typeof message === 'string') {
                    if (message.startsWith('Success Loaded game file') || message.indexOf('Entering main loop') >= 0) {
                        if (window.DRLoading) { window.DRLoading.hide(); }
                        else if (loadingOverlay) { loadingOverlay.style.display = 'none'; }
                    }
                }
